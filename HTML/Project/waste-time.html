<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Time · Time Vendor</title>
    <link rel="stylesheet" href="../Project/style/animation.css">
    <link rel="stylesheet" href="../Project/style/style.css">
    <link rel="stylesheet" href="../Project/style/waste-time.css">
</head>
<body>
    <header>
        <h1>
            <div class="icon">
                <img class="icon-moon" src="image/header/moon.svg" alt="moon">
                <img class="icon-sun" src="image/header/sun.svg" alt="sun">
            </div>
            <em>
                Time seller
            </em>
            <div class="icon">
                <img class="icon-moon" src="image/header/moon.svg" alt="moon">
                <img class="icon-sun" src="image/header/sun.svg" alt="sun">
            </div>
        </h1>
        <div class="header-actions">
            <label class="theme-switch">
                <input type="checkbox" id="theme-toggle" role="switch" aria-label="切换日间 / 夜间模式">
                <span class="track">
                    <span class="knob"></span>
                </span>
            </label>
            <a class="home-btn ani-jelly" href="index.html" aria-label="返回首页">
                <img src="image/header/house.svg" alt="">
            </a>
        </div>
    </header>

    <main class="countdown-main">
        <p class="countdown-eyebrow">WASTE TIME</p>
        <h2>让时间慢慢流走</h2>

        <!-- 翻牌钟（纯视觉，读屏看下面的状态文本） -->
        <div class="flip-clock" id="flip-clock" aria-hidden="true">
            <div class="flip-pair">
                <div class="flip-card" data-value="0">
                    <div class="flip-half flip-half-top"><span class="flip-digit">0</span></div>
                    <div class="flip-half flip-half-bottom"><span class="flip-digit">0</span></div>
                    <div class="flip-flap flip-flap-top"><span class="flip-digit">0</span></div>
                    <div class="flip-flap flip-flap-bottom"><span class="flip-digit">0</span></div>
                </div>
                <div class="flip-card" data-value="0">
                    <div class="flip-half flip-half-top"><span class="flip-digit">0</span></div>
                    <div class="flip-half flip-half-bottom"><span class="flip-digit">0</span></div>
                    <div class="flip-flap flip-flap-top"><span class="flip-digit">0</span></div>
                    <div class="flip-flap flip-flap-bottom"><span class="flip-digit">0</span></div>
                </div>
            </div>
            <span class="flip-colon">:</span>
            <div class="flip-pair">
                <div class="flip-card" data-value="0">
                    <div class="flip-half flip-half-top"><span class="flip-digit">0</span></div>
                    <div class="flip-half flip-half-bottom"><span class="flip-digit">0</span></div>
                    <div class="flip-flap flip-flap-top"><span class="flip-digit">0</span></div>
                    <div class="flip-flap flip-flap-bottom"><span class="flip-digit">0</span></div>
                </div>
                <div class="flip-card" data-value="0">
                    <div class="flip-half flip-half-top"><span class="flip-digit">0</span></div>
                    <div class="flip-half flip-half-bottom"><span class="flip-digit">0</span></div>
                    <div class="flip-flap flip-flap-top"><span class="flip-digit">0</span></div>
                    <div class="flip-flap flip-flap-bottom"><span class="flip-digit">0</span></div>
                </div>
            </div>
            <span class="flip-colon">:</span>
            <div class="flip-pair">
                <div class="flip-card" data-value="0">
                    <div class="flip-half flip-half-top"><span class="flip-digit">0</span></div>
                    <div class="flip-half flip-half-bottom"><span class="flip-digit">0</span></div>
                    <div class="flip-flap flip-flap-top"><span class="flip-digit">0</span></div>
                    <div class="flip-flap flip-flap-bottom"><span class="flip-digit">0</span></div>
                </div>
                <div class="flip-card" data-value="0">
                    <div class="flip-half flip-half-top"><span class="flip-digit">0</span></div>
                    <div class="flip-half flip-half-bottom"><span class="flip-digit">0</span></div>
                    <div class="flip-flap flip-flap-top"><span class="flip-digit">0</span></div>
                    <div class="flip-flap flip-flap-bottom"><span class="flip-digit">0</span></div>
                </div>
            </div>
        </div>

        <p class="sr-only" id="timer-status" role="status" aria-live="polite"></p>

        <div class="countdown-controls" role="group" aria-label="倒计时控制">
            <button class="control-btn ani-jelly" id="pause-btn" type="button" aria-label="暂停倒计时">
                <img class="icon-pause" src="image/pause.svg" alt="" aria-hidden="true">
                <img class="icon-play" src="image/play.svg" alt="" aria-hidden="true">
                <span id="pause-label">暂停</span>
            </button>
            <button class="control-btn ani-jelly" id="reset-btn" type="button" aria-label="重置倒计时">
                <img src="image/rotate-ccw-clock.svg" alt="" aria-hidden="true">
                <span>重置</span>
            </button>
            <button class="control-btn ani-jelly" id="end-btn" type="button" aria-label="结束倒计时并返回首页">
                <img src="image/square.svg" alt="" aria-hidden="true">
                <span>结束</span>
            </button>
        </div>

        <div class="finish-overlay" id="finish-overlay" hidden>
            <div class="finish-card ani-jelly-in">
                <h2>时间到了</h2>
                <p id="finish-message"></p>
                <a class="finish-home ani-jelly" href="index.html">
                    <img src="image/header/house.svg" alt="" aria-hidden="true">
                    <span>回到首页</span>
                </a>
            </div>
        </div>
    </main>

    <script src="js/theme.js"></script>
    <script src="js/countdown.js"></script>
</body>
</html>
